<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b221d" />
  <meta name="robots" content="noindex" />
  <title>Found a dog? — Tap to contact the owner</title>
  <meta name="description" content="If you found this dog, contact the owner here." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="wrap">
    <div class="tag-card" id="tagCard">

      <!-- decorative tag hole, like a real pendant -->
      <div class="tag-hole" aria-hidden="true"></div>

      <button type="button" class="lang-toggle" id="langToggle" aria-label="Change language / Cambiar idioma">
        <span id="langToggleLabel">ES</span>
      </button>

      <div class="photo-frame">
        <img id="dogPhoto" class="photo" alt="" hidden />
        <div id="photoPlaceholder" class="photo-placeholder" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 15.5c-3.2 0-6 2-6 4.3 0 1 .9 1.7 2 1.7h8c1.1 0 2-.7 2-1.7 0-2.3-2.8-4.3-6-4.3Z"/>
            <ellipse cx="4.8" cy="9.5" rx="1.8" ry="2.4"/>
            <ellipse cx="9.2" cy="6" rx="1.8" ry="2.4"/>
            <ellipse cx="14.8" cy="6" rx="1.8" ry="2.4"/>
            <ellipse cx="19.2" cy="9.5" rx="1.8" ry="2.4"/>
            <path d="M12 10c2.6 0 4 1.8 4 3.6 0 1-.7 1.4-1.5 1.1-.8-.3-1.6-.6-2.5-.6s-1.7.3-2.5.6c-.8.3-1.5-.1-1.5-1.1 0-1.8 1.4-3.6 4-3.6Z"/>
          </svg>
        </div>
      </div>

      <p class="eyebrow" id="statusLine">If you found this dog</p>
      <h1 id="dogName">Dog Name</h1>
      <p class="breed" id="dogBreed">Breed</p>

      <p class="instruction" id="instructionText">
        Please contact the owner using the details below — no app or account needed.
      </p>

      <div class="owners" id="owners">
        <!-- one row per owner (name + visible phone number + call button), filled in by script.js -->
      </div>

      <div class="microchip" id="microchipBlock">
        <span class="microchip-label" id="microchipLabel">Microchip no.</span>
        <span class="microchip-number" id="microchipNumber">—</span>
      </div>

      <div class="vet-block" id="vetBlock">
        <span class="vet-label" id="vetLabel">Usual vet</span>
        <span class="vet-name" id="vetName">—</span>
        <span class="vet-address" id="vetAddress"></span>
      </div>

    </div>

    <p class="footer-note" id="footerNote">This page runs entirely from a chip in this tag — no tracking, no account, no ads.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
